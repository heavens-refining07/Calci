<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0b1020;
      --card: #151b2f;
      --display: #0a0f1c;
      --key: #202840;
      --key-hover: #2b3550;
      --accent: #7c5cff;
      --danger: #ef5b72;
      --text: #f7f8ff;
      --muted: #9ca7c2;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(124,92,255,.22), transparent 32%),
        radial-gradient(circle at 85% 90%, rgba(66,153,225,.14), transparent 30%),
        var(--bg);
      color: var(--text);
    }
    .calculator {
      width: min(100%, 390px);
      padding: 18px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 28px;
      background: rgba(21,27,47,.92);
      box-shadow: 0 24px 70px rgba(0,0,0,.38);
      backdrop-filter: blur(14px);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 4px 14px;
    }
    .brand h1 { margin: 0; font-size: 17px; letter-spacing: .3px; }
    .brand span { color: var(--muted); font-size: 12px; }
    .display {
      min-height: 132px;
      padding: 20px 18px;
      border-radius: 20px;
      background: var(--display);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .expression {
      width: 100%;
      min-height: 25px;
      color: var(--muted);
      font-size: 16px;
      text-align: right;
      overflow-wrap: anywhere;
    }
    .result {
      width: 100%;
      margin-top: 5px;
      font-size: clamp(32px, 9vw, 46px);
      font-weight: 700;
      line-height: 1.08;
      text-align: right;
      overflow-wrap: anywhere;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      min-height: 62px;
      border: 0;
      border-radius: 17px;
      background: var(--key);
      color: var(--text);
      font: inherit;
      font-size: 20px;
      font-weight: 650;
      cursor: pointer;
      transition: transform .08s ease, background .15s ease;
      touch-action: manipulation;
    }
    button:hover { background: var(--key-hover); }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid rgba(124,92,255,.65); outline-offset: 2px; }
    .operator { background: rgba(124,92,255,.20); color: #d9d1ff; }
    .operator:hover { background: rgba(124,92,255,.30); }
    .equals { background: var(--accent); color: white; }
    .equals:hover { background: #6d4ff0; }
    .clear { color: #ff9cac; }
    .span-two { grid-column: span 2; }
    .hint { margin: 13px 3px 0; color: var(--muted); font-size: 11px; text-align: center; }
    @media (max-width: 360px) {
      .calculator { padding: 13px; border-radius: 22px; }
      button { min-height: 56px; }
      .display { min-height: 118px; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="brand">
      <h1>Calculator</h1>
      <span>Keyboard supported</span>
    </div>

    <section class="display" aria-live="polite">
      <div class="expression" id="expression">Ready</div>
      <div class="result" id="result">0</div>
    </section>

    <section class="keys">
      <button class="clear span-two" data-action="clear">AC</button>
      <button class="operator" data-action="delete">DEL</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals span-two" data-action="calculate">=</button>
    </section>

    <p class="hint">Use 0–9, +, −, ×, ÷, decimal point, Enter and Backspace.</p>
  </main>

  <script>
    (() => {
      const expressionEl = document.getElementById("expression");
      const resultEl = document.getElementById("result");
      const keys = document.querySelector(".keys");

      let expression = "";
      let justCalculated = false;

      const operators = "+-*/";

      function displayExpression(value) {
        return value.replaceAll("*", " × ").replaceAll("/", " ÷ ")
          .replaceAll("+", " + ").replaceAll("-", " − ")
          .replace(/\s+/g, " ").trim();
      }

      function update() {
        expressionEl.textContent = expression ? displayExpression(expression) : "Ready";
        resultEl.textContent = expression || "0";
      }

      function append(value) {
        if (justCalculated && /[0-9.]/.test(value)) expression = "";
        justCalculated = false;

        if (operators.includes(value)) {
          if (!expression) return;
          if (operators.includes(expression.at(-1))) {
            expression = expression.slice(0, -1) + value;
          } else {
            expression += value;
          }
        } else if (value === ".") {
          const current = expression.split(/[+\-*/]/).pop();
          if (!current.includes(".")) expression += current ? "." : "0.";
        } else {
          expression += value;
        }
        update();
      }

      function clearAll() {
        expression = "";
        justCalculated = false;
        update();
      }

      function del() {
        expression = expression.slice(0, -1);
        justCalculated = false;
        update();
      }

      function calculate() {
        if (!expression || operators.includes(expression.at(-1))) return;
        if (!/^[0-9+\-*/. ]+$/.test(expression)) return;

        try {
          // The expression is restricted to calculator characters before evaluation.
          const value = Function('"use strict"; return (' + expression + ')')();
          if (!Number.isFinite(value)) throw new Error("Invalid result");
          const rounded = Math.round((value + Number.EPSILON) * 1e12) / 1e12;
          expressionEl.textContent = displayExpression(expression) + " =";
          resultEl.textContent = String(rounded);
          expression = String(rounded);
          justCalculated = true;
        } catch {
          expressionEl.textContent = "Error";
          resultEl.textContent = "Invalid expression";
          expression = "";
          justCalculated = false;
        }
      }

      keys.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        const { value, action } = button.dataset;
        if (action === "clear") clearAll();
        else if (action === "delete") del();
        else if (action === "calculate") calculate();
        else if (value) append(value);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key >= "0" && event.key <= "9") append(event.key);
        else if (["+", "-", "*", "/"].includes(event.key)) append(event.key);
        else if (event.key === ".") append(".");
        else if (event.key === "Enter" || event.key === "=") {
          event.preventDefault();
          calculate();
        } else if (event.key === "Backspace") del();
        else if (event.key === "Escape") clearAll();
      });

      update();
    })();
  </script>
</body>
</html>
